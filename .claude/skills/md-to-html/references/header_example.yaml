# Example YAML Header for PaperFlow

This is the standard YAML header used in the PaperFlow project for rendering Korean markdown (translations, explainers, audio narrations) to HTML.

## Key Configuration Options

- **`lang: ko`**: Sets document language to Korean
- **`toc: true`**: Enables table of contents
- **`toc-location: left`**: Places TOC in left sidebar
- **`embed-resources: true`**: **CRITICAL** - Embeds all images as base64 in HTML for self-contained output
- **`theme: cosmo`**: Uses Cosmo Bootstrap theme
- **CJK word-break CSS**: **CRITICAL for Korean** - `word-break: keep-all` keeps 한글 어절 intact at line breaks; always paired with `overflow-wrap: break-word` so long English tokens/URLs still wrap. Applied to `body` AND width-constrained elements (headings, list items, table cells) where the rule is easily lost
- **Custom CSS**: Hides Quarto header/title block and centers content with equal padding

## Usage in PaperFlow

Prepend this header to Korean markdown before rendering with Quarto:

- `*_ko.md` / `*_ko_explained.md`: these normally already carry a header — verify it has `embed-resources: true` and the word-break pair, and patch the header if missing.
- `*_ko_audio.md` / `*_ko_audio_brief.md`: **YAML-less by design** (raw-TTS). Never edit the original — prepend this header to a same-directory temp copy (`<name>.render.md`), render with `--output <name>.html`, then delete the copy.
