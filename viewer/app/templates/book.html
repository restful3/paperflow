{% extends "base.html" %}

{% block title %}PaperFlow - {{ book_title|e }}{% endblock %}

{% block body %}
<div x-data="bookApp()" x-init="init()" class="min-h-full flex flex-col transition-colors">

  <!-- Navbar -->
  <nav class="sticky top-0 z-40 shadow-lg transition-colors"
       :class="$store.darkMode.on ? 'bg-gradient-to-r from-gray-800 via-gray-700 to-gray-800' : 'bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500'">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-14">
        <div class="flex items-center gap-2 text-sm min-w-0">
          <a href="/books" class="text-white/70 hover:text-white transition shrink-0">Books</a>
          <span class="text-white/40">/</span>
          <span class="text-white font-semibold truncate">{{ book_title|e }}</span>
        </div>
        <div class="flex items-center space-x-3 shrink-0">
          <button @click="$store.lang.toggle()"
                  class="text-white/80 hover:text-white transition text-xs font-semibold px-1.5 py-0.5 rounded border border-white/30 hover:border-white/60"
                  x-text="$store.lang.ko ? 'KO' : 'EN'"></button>
          <button @click="$store.darkMode.toggle()" class="text-white/80 hover:text-white transition text-sm"
                  :title="$store.darkMode.on ? 'Light mode' : 'Dark mode'">
            <svg x-show="!$store.darkMode.on" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
            <svg x-show="$store.darkMode.on" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 flex-1">
    <div x-show="loading" class="text-center py-20 text-sm" :class="$store.darkMode.on ? 'text-gray-500' : 'text-gray-400'">Loading…</div>

    <template x-if="!loading && book">
      <div>
        <!-- Book header -->
        <div class="flex gap-4 items-start mb-6">
          <div class="w-24 sm:w-28 shrink-0 aspect-[3/4] rounded-lg overflow-hidden flex items-center justify-center"
               :class="$store.darkMode.on ? 'bg-gray-700/40' : 'bg-gray-100'">
            <template x-if="book.cover_url">
              <img :src="book.cover_url" :alt="book.title" class="w-full h-full object-cover">
            </template>
            <template x-if="!book.cover_url">
              <svg class="w-8 h-8 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
              </svg>
            </template>
          </div>
          <div class="flex-1 min-w-0">
            <h1 class="text-xl font-bold leading-tight" :class="$store.darkMode.on ? 'text-gray-100' : 'text-gray-900'" x-text="book.title"></h1>
            <p class="mt-1 text-sm" :class="$store.darkMode.on ? 'text-gray-400' : 'text-gray-500'"
               x-text="[book.author, book.year].filter(Boolean).join(' · ')"></p>
            <div class="mt-3 max-w-md">
              <div class="flex items-center justify-between text-xs mb-1" :class="$store.darkMode.on ? 'text-gray-400' : 'text-gray-500'">
                <span x-text="`${book.aggregate.chapters_total} chapters`"></span>
                <span x-text="`${book.aggregate.progress_pct}%`"></span>
              </div>
              <div class="h-2 w-full rounded-full overflow-hidden" :class="$store.darkMode.on ? 'bg-gray-700' : 'bg-gray-200'">
                <div class="h-full bg-indigo-500 rounded-full transition-all" :style="`width: ${book.aggregate.progress_pct}%`"></div>
              </div>
            </div>
            <template x-if="resumeChapter">
              <a :href="chapterUrl(resumeChapter)"
                 class="inline-flex items-center gap-1.5 mt-3 px-3 py-1.5 rounded-lg text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span x-text="`이어읽기 · ${resumeChapter.title}`"></span>
              </a>
            </template>
          </div>
        </div>

        <!-- Chapter list -->
        <div class="rounded-xl border overflow-hidden divide-y"
             :class="$store.darkMode.on ? 'bg-gray-800 border-gray-700 divide-gray-700' : 'bg-white border-gray-200 divide-gray-100'">
          <template x-for="ch in book.chapters" :key="ch.chapter_id">
            <a :href="chapterUrl(ch)"
               class="flex items-center gap-3 px-4 py-3 transition-colors"
               :class="$store.darkMode.on ? 'hover:bg-gray-700/40' : 'hover:bg-gray-50'">
              <span class="w-8 text-center text-sm font-mono shrink-0" :class="$store.darkMode.on ? 'text-gray-500' : 'text-gray-400'" x-text="ch.order ?? ''"></span>
              <div class="flex-1 min-w-0">
                <div class="text-sm font-medium truncate" :class="$store.darkMode.on ? 'text-gray-100' : 'text-gray-900'" x-text="ch.title"></div>
                <div class="mt-1 h-1 w-full max-w-xs rounded-full overflow-hidden" :class="$store.darkMode.on ? 'bg-gray-700' : 'bg-gray-200'">
                  <div class="h-full bg-indigo-500 rounded-full" :style="`width: ${ch.progress}%`"></div>
                </div>
              </div>
              <span class="text-[11px] px-2 py-0.5 rounded-full shrink-0" :class="statusClass(ch.status)" x-text="statusLabel(ch.status)"></span>
            </a>
          </template>
        </div>
      </div>
    </template>
  </main>
</div>

<script>
function bookApp() {
  return {
    bookName: {{ book_name_encoded|tojson }},
    book: null,
    loading: true,

    async init() {
      try {
        const r = await apiFetch(`/api/books/${this.bookName}/info`);
        if (r && r.ok) this.book = await r.json();
        else if (r) { showToast('책을 불러오지 못했습니다', 'error'); window.location.href = '/books'; }
      } catch (e) {
        showToast('책을 불러오지 못했습니다', 'error');
      } finally {
        this.loading = false;
      }
    },

    get resumeChapter() {
      if (!this.book) return null;
      return this.book.chapters.find(c => (c.progress || 0) < 100) || this.book.chapters[0] || null;
    },

    chapterUrl(ch) {
      return `/books/${this.bookName}/chapters/${encodeURIComponent(ch.chapter_id)}`;
    },

    statusLabel(s) {
      return {
        complete: '완료', translating: '번역중', converted: '변환됨',
        pending: '대기', error: '오류', needs_review: '검토',
      }[s] || s;
    },

    statusClass(s) {
      const dark = this.$store.darkMode.on;
      const map = {
        complete: dark ? 'bg-emerald-900/40 text-emerald-300' : 'bg-emerald-100 text-emerald-700',
        translating: dark ? 'bg-amber-900/40 text-amber-300' : 'bg-amber-100 text-amber-700',
        converted: dark ? 'bg-sky-900/40 text-sky-300' : 'bg-sky-100 text-sky-700',
        error: dark ? 'bg-red-900/40 text-red-300' : 'bg-red-100 text-red-700',
        needs_review: dark ? 'bg-orange-900/40 text-orange-300' : 'bg-orange-100 text-orange-700',
      };
      return map[s] || (dark ? 'bg-gray-700 text-gray-300' : 'bg-gray-100 text-gray-500');
    },
  };
}
</script>
{% endblock %}
