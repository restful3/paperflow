services:
  paperflow-converter:
    build:
      context: .
      args:
        PDF_CONVERTER: ${PDF_CONVERTER:-marker}
    image: paperflow-converter:latest
    container_name: paperflow_converter
    command: ./run_all_watch.sh
    runtime: nvidia
    volumes:
      - ./newones:/app/newones
      - ./outputs:/app/outputs
      - ./newbooks:/app/newbooks
      - ./books:/app/books
      - ./logs:/app/logs
      - ./config.json:/app/config.json
      - ./model_cache:/root/.cache
    env_file:
      - .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OPENAI_BASE_URL=http://host.docker.internal:8317/v1
      - PROCESS_TIMEOUT_SECONDS=${PROCESS_TIMEOUT_SECONDS:-7200}
      - PF_GPU_LOCK=/app/outputs/.gpu.lock
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    restart: unless-stopped
    # Use host networking or extra_hosts to verify connectivity if host.docker.internal fails on Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"

  paperflow-viewer:
    build:
      context: ./viewer
      dockerfile: Dockerfile
    image: paperflow-viewer:latest
    container_name: paperflow_viewer
    # Run as host user (uid:gid 1000) so files written into ./outputs ./archives
    # are owned by restful3, not root — lets Synology Drive (runs as restful3)
    # sync/rename them instead of getting permission-denied (-3). converter/tts
    # stay root due to their /root/.cache (CUDA model cache) mount.
    user: "1000:1000"
    ports:
      - "8090:8000"
    volumes:
      - ./outputs:/data/outputs
      - ./archives:/data/archives
      - ./newones:/data/newones
      - ./newbooks:/data/newbooks
      - ./logs:/data/logs
      - ./books:/data/books
      - ./book_archives:/data/book_archives
    env_file:
      - .env
    environment:
      - BASE_DIR=/data
      - OPENAI_BASE_URL=http://host.docker.internal:8317/v1
      - MCP_API_KEY=${MCP_API_KEY:-}
      - MCP_PUBLIC_BASE_URL=${MCP_PUBLIC_BASE_URL:-}
      - MCP_JOB_TTL_DAYS=${MCP_JOB_TTL_DAYS:-7}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-}
      - MCP_REQUIRE_TRANSLATION=${MCP_REQUIRE_TRANSLATION:-true}
      - TTS_SERVICE_URL=http://paperflow-tts:8100
      - AUDIO_TOKEN_SECRET=${AUDIO_TOKEN_SECRET:-}
      - AUDIO_REQUIRE_COMPLETE=${AUDIO_REQUIRE_COMPLETE:-true}  # 생성-먼저(완성 후 재생). false=라이브 스트리밍 복귀.
      # NOTE: access log 에 ?token/?ptoken 노출 가능 — viewer 가 uvicorn.access 에 redaction 필터를
      #       부착(main.py _TokenRedactFilter). 운영 시 프록시 마스킹 병행 권장.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  paperflow-tts:
    build: ./tts_service
    image: paperflow-tts:latest
    container_name: paperflow_tts
    runtime: nvidia
    volumes:
      - ./outputs:/data/outputs
      - ./books:/data/books
      - ./book_archives:/data/book_archives
      - ./model_cache:/root/.cache
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PF_GPU_LOCK=/data/outputs/.gpu.lock      # converter의 /app/outputs/.gpu.lock 과 동일 호스트 파일
      - PF_OUTPUTS_ROOT=/data/outputs
      - VOXCPM_VOICE=${VOXCPM_VOICE:-09_chaewon} # 낭독 화자(번들 음성 라이브러리 키). 바꾸면 오디오 재생성.
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True  # 12GB 카드 단편화 완화(VoxCPM2 합성 시 ~11.4GB 피크)
      - SWEEP_ENABLED=${SWEEP_ENABLED:-false}
      - SWEEP_INTERVAL=${SWEEP_INTERVAL:-60}
      - SWEEP_MAX_PAPERS=${SWEEP_MAX_PAPERS:-3}
      - AUDIO_TOKEN_SECRET=${AUDIO_TOKEN_SECRET:-}
      # 정리 grace = 토큰 TTL+grace. viewer 와 같은 값을 받아야 viewer 가 발급한 토큰 유효 동안
      # tts 가 구버전 세그먼트를 지우지 않는다(Codex MEDIUM). 기본값은 양쪽 코드가 동일.
      - AUDIO_TOKEN_TTL=${AUDIO_TOKEN_TTL:-43200}
      - AUDIO_RESUME_GRACE=${AUDIO_RESUME_GRACE:-3600}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    expose:
      - "8100"
    restart: unless-stopped
